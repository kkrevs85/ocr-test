[project]
name = "doc2md"
version = "0.1.0"
description = "PDF / Office / メール / csv・txt / 画像を、構造を保ったMarkdownに変換するバッチツール"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10",
    "numpy>=1.26",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "python-oxmsg>=0.0.2",
    "markdownify>=0.13",
    "charset-normalizer>=3.3",
    "pyyaml>=6.0",
    "paddleocr>=3.7",
    "paddlepaddle>=3.3",
]

[project.scripts]
doc2md = "doc2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2md"]
